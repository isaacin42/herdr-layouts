<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <pattern id="brick" width="24" height="8" patternUnits="userSpaceOnUse">
      <rect width="24" height="8" fill="#0c0708"/>
      <rect x="0.5" y="0.5" width="11" height="3" rx="0.4" fill="#36191a"/>
      <rect x="12.5" y="0.5" width="11" height="3" rx="0.4" fill="#2d1614"/>
      <rect x="-5.5" y="4.5" width="11" height="3" rx="0.4" fill="#2f1816"/>
      <rect x="6.5" y="4.5" width="11" height="3" rx="0.4" fill="#3a1d19"/>
      <rect x="18.5" y="4.5" width="11" height="3" rx="0.4" fill="#2a1512"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- wall -->
  <rect width="320" height="84" fill="url(#brick)"/>
  <rect width="320" height="84" fill="url(#vig)"/>
  <circle cx="7" cy="6" r="1.6" fill="#ff5f57"/><circle cx="12" cy="6" r="1.6" fill="#febc2e"/><circle cx="17" cy="6" r="1.6" fill="#28c840"/>
  <!-- sign 1: working -->
  <rect x="10" y="12" width="96" height="66" rx="4" fill="#0d0a10" fill-opacity="0.8" stroke="#3d6bff" stroke-opacity="0.55" stroke-width="0.6"/>
  <path d="M18 30 c4 -10 9 -10 10 0 s5 -8 9 0 s4 -6 8 0 s6 -10 10 -2" fill="none" stroke="#3d6bff" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M18 30 c4 -10 9 -10 10 0 s5 -8 9 0 s4 -6 8 0 s6 -10 10 -2" fill="none" stroke="#e3ebff" stroke-width="0.9" stroke-linecap="round"/>
  <g stroke-linecap="round">
    <rect x="16" y="40" width="2" height="4" rx="0.5" fill="#ff6a3d"/><line x1="22" y1="42" x2="70" y2="42" stroke="#3d6bff" stroke-width="3.4" stroke-opacity="0.55"/><line x1="22" y1="42" x2="70" y2="42" stroke="#e3ebff" stroke-width="0.8"/><rect x="74" y="40" width="2" height="4" rx="0.5" fill="#ff6a3d"/>
    <rect x="16" y="49" width="2" height="4" rx="0.5" fill="#ff6a3d"/><line x1="22" y1="51" x2="62" y2="51" stroke="#ff2a3d" stroke-width="3.4" stroke-opacity="0.55"/><line x1="22" y1="51" x2="62" y2="51" stroke="#ffe3e6" stroke-width="0.8"/><rect x="66" y="49" width="2" height="4" rx="0.5" fill="#ff6a3d"/>
    <rect x="16" y="58" width="2" height="4" rx="0.5" fill="#a8391f"/><line x1="22" y1="60" x2="58" y2="60" stroke="#5f5a68" stroke-width="1.6"/><rect x="62" y="58" width="2" height="4" rx="0.5" fill="#a8391f"/>
  </g>
  <rect x="16" y="68" width="22" height="5" rx="0.8" fill="#8e8996"/>
  <!-- sign 2: done -->
  <rect x="114" y="12" width="92" height="56" rx="4" fill="#0d0a10" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.6"/>
  <path d="M122 30 c3 -9 8 -9 9 0 s4 -7 8 0 s5 -7 9 0" fill="none" stroke="#ff9a2e" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M122 30 c3 -9 8 -9 9 0 s4 -7 8 0 s5 -7 9 0" fill="none" stroke="#fff1de" stroke-width="0.9" stroke-linecap="round"/>
  <rect x="120" y="40" width="2" height="4" rx="0.5" fill="#ff6a3d"/><line x1="126" y1="42" x2="170" y2="42" stroke="#ff9a2e" stroke-width="3.4" stroke-opacity="0.55" stroke-linecap="round"/><line x1="126" y1="42" x2="170" y2="42" stroke="#fff1de" stroke-width="0.8" stroke-linecap="round"/><rect x="174" y="40" width="2" height="4" rx="0.5" fill="#ff6a3d"/>
  <rect x="120" y="49" width="2" height="4" rx="0.5" fill="#a8391f"/><line x1="126" y1="51" x2="160" y2="51" stroke="#5f5a68" stroke-width="1.6" stroke-linecap="round"/><rect x="164" y="49" width="2" height="4" rx="0.5" fill="#a8391f"/>
  <rect x="120" y="58" width="22" height="5" rx="0.8" fill="#8e8996"/>
  <!-- sign 3: dark glass -->
  <rect x="214" y="12" width="96" height="46" rx="4" fill="#0d0a10" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.6"/>
  <path d="M222 30 c3 -9 8 -9 9 0 s4 -7 8 0 s5 -9 10 -1" fill="none" stroke="#5f5a68" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="220" y="38" width="2" height="4" rx="0.5" fill="#a8391f"/><line x1="226" y1="40" x2="268" y2="40" stroke="#5f5a68" stroke-width="1.6" stroke-linecap="round"/><rect x="272" y="38" width="2" height="4" rx="0.5" fill="#a8391f"/>
  <rect x="220" y="48" width="22" height="5" rx="0.8" fill="#8e8996"/>
  <!-- breakers -->
  <rect y="84" width="320" height="10" fill="#121015"/>
  <rect y="84" width="320" height="0.5" fill="#241f29"/><rect y="93.5" width="320" height="0.5" fill="#241f29"/>
  <rect x="6" y="88" width="24" height="2" fill="#e3ebff"/>
  <circle cx="38" cy="89" r="1.3" fill="#3d6bff"/><circle cx="52" cy="89" r="1.3" fill="#ff2a3d"/><circle cx="66" cy="89" r="1.3" fill="#ff9a2e"/><circle cx="80" cy="89" r="1.3" fill="#2a2430"/>
  <g fill="#0a080c" stroke="#3a3440" stroke-width="0.4">
    <rect x="104" y="85.5" width="4" height="7" rx="0.6"/><rect x="134" y="85.5" width="4" height="7" rx="0.6"/><rect x="164" y="85.5" width="4" height="7" rx="0.6"/><rect x="290" y="85.5" width="4" height="7" rx="0.6"/>
  </g>
  <rect x="104.8" y="86.2" width="2.4" height="2.4" fill="#3d6bff"/><rect x="134.8" y="89.4" width="2.4" height="2.4" fill="#5c5764"/><rect x="164.8" y="89.4" width="2.4" height="2.4" fill="#5c5764"/><rect x="290.8" y="89.4" width="2.4" height="2.4" fill="#8e8996"/>
  <!-- storefront -->
  <rect y="94" width="320" height="106" fill="#060407"/>
  <rect x="4" y="97" width="154" height="100" rx="3" fill="#0a080d" stroke="#5a8cff" stroke-width="0.5"/>
  <rect x="7" y="99" width="148" height="7" rx="3.5" fill="#14101a" stroke="#3d6bff" stroke-width="0.4"/>
  <rect x="162" y="97" width="154" height="100" rx="3" fill="#0a080d" stroke="#2a2430" stroke-width="0.5"/>
  <rect x="165" y="99" width="148" height="7" rx="3.5" fill="#0c0a0f" stroke="#ff9a2e" stroke-width="0.4"/>
  <g fill="#e6e2ee" opacity="0.6">
    <rect x="10" y="112" width="80" height="1.4"/><rect x="10" y="117" width="110" height="1.4"/><rect x="10" y="122" width="64" height="1.4"/><rect x="10" y="130" width="96" height="1.4"/>
    <rect x="168" y="112" width="72" height="1.4"/><rect x="168" y="117" width="100" height="1.4"/><rect x="168" y="122" width="50" height="1.4"/>
  </g>
</svg>
